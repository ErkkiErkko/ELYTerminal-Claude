name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        shell: pwsh
        run: |
          git config --global http.sslBackend openssl
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2.9.2
      # A cold first PowerShell outruns the shell tests.
      - name: Warm up Windows PowerShell
        shell: pwsh
        run: |
          $powershell = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell -NoProfile -NonInteractive -Command "Write-Output 'PowerShell warm-up complete'"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell warm-up failed with exit code $LASTEXITCODE"
          }
      - run: cargo test --locked --quiet
      - run: cargo build --locked
      - name: Build Windows ARM64 package
        shell: pwsh
        run: ./scripts/windows-zip.ps1
      - name: Keep Windows ARM64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ELYTerminal-Claude-windows-aarch64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: target/release/ELYTerminal-*-windows-aarch64.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        shell: pwsh
        run: |
          git config --global http.sslBackend openssl
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check, test and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools were not found' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect Windows download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/licenses -Force | Out-Null
          Copy-Item target/release/elyterminal.exe dist/ELYTerminal-Claude.exe
          Copy-Item target/release/conpty.dll,target/release/OpenConsole.exe dist/
          Copy-Item vendor/conpty/LICENSE dist/licenses/ConPTY-MIT.txt
          Copy-Item LICENSE dist/licenses/ELYTerminal-MIT.txt
          Copy-Item LICENSE-GHOSTTY dist/licenses/Ghostty-MIT.txt
          Copy-Item assets/themes/LICENSE dist/licenses/Themes-MIT.txt
          Copy-Item assets/fonts/*LICENSE.txt dist/licenses/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ELYTerminal-Claude-windows-x64
          path: dist/
          if-no-files-found: error
