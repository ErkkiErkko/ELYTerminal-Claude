name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        shell: pwsh
        run: |
          git config --global http.sslBackend openssl
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check, test and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools were not found' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect Windows download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/licenses -Force | Out-Null
          Copy-Item target/release/elyterminal.exe dist/ELYTerminal-Claude.exe
          Copy-Item LICENSE dist/licenses/ELYTerminal-MIT.txt
          Copy-Item LICENSE-GHOSTTY dist/licenses/Ghostty-MIT.txt
          Copy-Item assets/themes/LICENSE dist/licenses/Themes-MIT.txt
          Copy-Item assets/fonts/*LICENSE.txt dist/licenses/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ELYTerminal-Claude-windows-x64
          path: dist/
          if-no-files-found: error
